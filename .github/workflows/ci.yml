name: PAIMANA CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-ci:
    name: Backend Lint & Automated Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sih2026_paimana
          POSTGRES_USER: paimana_admin
          POSTGRES_PASSWORD: test_password_123
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio ruff psycopg2-binary httpx

      - name: Lint with Ruff
        run: |
          ruff check backend/ data/ ml/ --ignore E501,F401,F841 || true

      - name: Run Backend Tests
        env:
          DATABASE_URL: postgresql://paimana_admin:test_password_123@localhost:5432/sih2026_paimana
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test_secret_jwt_key_sih2026
        run: |
          pytest backend/tests/ -v

  frontend-ci:
    name: Frontend TypeScript Typecheck & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm install

      - name: TypeScript Type Check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build Production Frontend Assets
        working-directory: frontend
        run: npm run build

  ml-pipeline-validation:
    name: ML Model & Feature Matrix Validation
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install ML Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Model Artifacts and Loading
        run: |
          python -c "
          import joblib
          from pathlib import Path
          
          cost_model_path = Path('ml/models/best_model_cost.joblib')
          delay_model_path = Path('ml/models/best_model_delay.joblib')
          
          assert cost_model_path.exists(), 'Cost model missing!'
          assert delay_model_path.exists(), 'Delay model missing!'
          
          cost_m = joblib.load(cost_model_path)
          delay_m = joblib.load(delay_model_path)
          print('Loaded Cost & Delay model artifacts successfully.')
          "

